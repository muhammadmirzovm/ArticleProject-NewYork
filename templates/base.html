{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" type="image/x-icon">
 <title>{% block title %}{% endblock %}</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav style="background-color: #3178ab !important;" class="navbar navbar-expand-lg bg-body-tertiary bg-primary shadow-lg p-3 mb-5 bg-body-tertiary rounded"  >
  <!-- class="navbar navbar-expand-lg bg-body-tertiary " -->
  <!-- class="navbar bg-primary" data-bs-theme="dark" -->
  <div class="container-fluid">
    <img class="mx-2" style="width: 40px !important;" src="{% static 'images/home.png' %}" alt="">
    <a class="navbar-brand text-white" href="{% url 'article_list' %}">Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="text-white nav-link active" aria-current="page" href="{% url 'article_list' %}">Blog</a>
        </li>
        <li class="nav-item">
          <a class="text-white nav-link active" aria-current="page" href="{% url 'article_create' %}">Maqola +</a>
        </li>
</ul>
<div class="registration">
  {% if user.is_authenticated %}
  <span class="badge text-bg-warning">Salom,{{ user.username }} !</span>

   <form method="post" action="{% url 'logout' %}" style="display:inline-block;">
     {% csrf_token %}
     <button class="btn btn-light" type="submit">Logout</button>
   </form>
 {% else %}
   <a class="btn btn-success" href="{% url 'login' %}">Login</a>
   <a class="btn btn-success" href="{% url 'signup' %}">Signup</a>
 {% endif %}
</div>
    </div>
  </div>
</nav>

<div class="container border bg-light p-4 my-5 rounded ">
   {% block content %}{% endblock %}
</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
